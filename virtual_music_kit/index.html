<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,  user-scalable=no">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="drums">
  <div class="buttons-module">
    <nav class="dropdown">
      <button>Standard</button>
      <ul class="">
        <li class="active">Standard</li>
        <li class="">Powerful</li>
        <li class="">Monumental</li>
        <li class="">Fresh</li>
        <li class="">Minimalistic</li>
        <li class="">Energetic</li>
      </ul>
    </nav>
    <button>Show shortcuts</button>
  </div>
  <div class="drums"><img src="assets/img/drum-kit-standard.eb6cdcf0e2d2b6c360fb.png" alt="drums">
    <div class="drumstick">
      <span class="drumstick--snareLeft left-drumstick"></span>
      <span class="drumstick--snareRight right-drumstick"></span>
      <span class="drumstick--hihatLeft left-drumstick"></span>
      <span class="drumstick--hihatRight right-drumstick"></span>
      <span class="drumstick--crash left-drumstick"></span>
      <span class="drumstick--ride right-drumstick"></span>
      <span class="drumstick--tom1 left-drumstick"></span>
      <span class="drumstick--tom2 right-drumstick"></span>
      <span class="drumstick--floor right-drumstick"></span>
      <span class="drumstick--default-left left-drumstick"></span>
      <span class="drumstick--default-right right-drumstick"></span>
    </div>
    <div class="bass">
      <div class="bass-pedal-wrapper">
        <div class="head"></div>
        <div class="pedal"></div>
      </div>
    </div>
    <div class="hihat">
      <div class="hihat-cymbal"></div>
      <div class="drum">
        <div></div>
        <div></div>
      </div>
      <div class="pedal-wrapper">
        <div class="chain"></div>
        <div class="pedal"></div>
      </div>
    </div>
    <div class="snare">
      <div class="drum"></div>
      <div class="cross"></div>
    </div>
    <div class="tom-1"></div>
    <div class="tom-2"></div>
    <div class="crash"><span class="fixator"></span>
      <div class="--crash-flicker"></div>
      <div class="--crash-cymbal"></div>
      <div class="--crash-click-area"></div>
    </div>
    <div class="ride">
      <div class="--ride-cymbal"></div>
      <span class="fixator"></span>
      <div class="--ride-click-area"></div>
    </div>
    <div class="floor"></div>
  </div>
</div>
<script type="module" src="assets/js/script.js"></script>
</body>
</html>
